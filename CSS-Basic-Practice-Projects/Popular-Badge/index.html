<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo">Sabit</div>
            <ul class="nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <section class="pricing">
            <div class="card">
                <h2>Basic</h2>
                <h1>$9 <span>/month</span></h1>
                <ul>
                    <li>1 Website</li>
                    <li>5 GB Storage</li>
                    <li>Email Support</li>
                </ul>
                <button>Choose Plan</button>
            </div>
            <div class="card featured">

                <span class="badge">Most Popular</span>

                <h2>Standard</h2>

                <h1>$19<span>/month</span></h1>

                <ul>
                    <li>10 Websites</li>
                    <li>50 GB Storage</li>
                    <li>Priority Support</li>
                </ul>

                <button>Choose Plan</button>

            </div>
            <div class="card">
                <h2>Premium</h2>
                <h1>$39 <span>/month</span></h1>
                <ul>
                    <li>Unlimited Websites</li>
                    <li>200 GB Storage</li>
                    <li>24/7 Support</li>
                </ul>
                <button>Choose Plan</button>
            </div>
        </section>
    </main>
</body>

</html>
